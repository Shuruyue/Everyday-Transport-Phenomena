# Synthetic Week 2 run (see config/synthetic/week1.toml for how [truth] is used).

[meta]
synthetic = true
output_dir = "results/synthetic/week2"

[environment]
T_inf_C = 25.0
T_sur_C = 25.0
P_kPa = 101.3
RH_pct = 60.0

[diffusivity]
source = "fuller"

[analysis]
recess_model = "stagnant_layer"
sigma_mass_g = 0.01
sigma_T_K = 0.2
monte_carlo_n = 150
seed = 20260113
week1_results = "results/synthetic/week1/week1_results.json"

[truth]
seed = 11
noise_mass_g = 0.01
noise_T_K = 0.2
D_ethanol_25C_m2_s = 1.18e-5
multiplier = { "natural" = 1.35, "forced" = 1.25 }
UA_bottom_W_per_K = 0.03
U_m_s = { "fan-low" = 1.5 }
initial_liquid_g = { "ethanol-still-1" = 15.8, "ethanol-fan-low-1" = 15.8, "aqueous-75-fan-low-1" = 17.4 }
duration_h = { "ethanol-still-1" = 6.0, "ethanol-fan-low-1" = 3.0, "aqueous-75-fan-low-1" = 4.0 }
stefan_duration_h = 36.0
stefan_interval_h = 2.0
stefan_level_noise_mm = 0.1

[[stefan]]
name = "tube-A"
csv = "data/synthetic/w2_stefan_A.csv"
reading = "mass"
inner_diameter_mm = 12.0
z0_mm = 30.0

[[stefan]]
name = "tube-B"
csv = "data/synthetic/w2_stefan_B.csv"
reading = "level"
inner_diameter_mm = 16.0
z0_mm = 45.0

[dish]
inner_diameter_mm = 90.0
rim_height_mm = 5.0
tare_g = 38.0
dish_mass_g = 38.0
dish_cp_J_per_kgK = 840.0
eps_liquid = 0.95
UA_bottom_W_per_K = 0.05

[[dish_runs]]
name = "ethanol-still-1"
csv = "data/synthetic/w2_dish_still_1.csv"
liquid = "ethanol"
mode = "natural"
rate_window_min = [0.0, 60.0]

[[dish_runs]]
name = "ethanol-fan-low-1"
csv = "data/synthetic/w2_dish_fan-low_1.csv"
liquid = "ethanol"
mode = "forced"
fan_label = "fan-low"
U_m_s = 1.6
rate_window_min = [0.0, 30.0]

[[dish_runs]]
name = "aqueous-75-fan-low-1"
csv = "data/synthetic/w2_dish_aqueous75_fan-low_1.csv"
liquid = "aqueous"
ethanol_mass_fraction = 0.68
mode = "forced"
fan_label = "fan-low"
U_m_s = 1.6
multiplier_from = "ethanol-fan-low-1"
rate_window_min = [0.0, 30.0]
