[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "transport-phenomena-experiments"
version = "0.1.0"
description = "Heat and mass transfer in everyday life: models, inverse analysis and verification for two Transport Phenomena II self-study experiments"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shuruyue" }]
dependencies = ["numpy>=2.0", "scipy>=1.13", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # SciPy's BDF allocates its difference array with np.empty; on the first step it subtracts a
    # row that is still uninitialized memory and warns when the leftover bits are inf/NaN. The row
    # is overwritten before it is ever read, so results are unaffected, but the warning appears
    # at random and made the transient-fit test flaky. Only this warning, only from bdf, is ignored.
    "ignore:invalid value encountered in subtract:RuntimeWarning:scipy.integrate._ivp.bdf",
]
